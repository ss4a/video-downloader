<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Video Downloader</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%237c8cff'/><path d='M16 8v12m0 0-5-5m5 5 5-5M10 24h12' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M6 19.5h12"/></svg>
      </span>
      Video Downloader
    </div>
  </header>

  <main class="stage">
    <section class="view">
      <div class="hero">
        <h1>Sign in</h1>
        <p class="lede">Enter the password you set when you started the app.</p>
      </div>

      <form class="url-form login-form" id="login-form" novalidate>
        <div class="field">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" type="password" autocomplete="current-password"
                 placeholder="Password" aria-label="Password" autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" id="login-btn">
          <span class="btn-label">Sign in</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="alert" id="login-error" role="alert" hidden></div>
    </section>
  </main>

  <script src="/static/login.js"></script>
</body>
</html>
